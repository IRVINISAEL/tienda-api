services:
  api:
    image: ${IMAGE:-tienda-api:local}
    ports: ["3001:3000"]
    environment:
      - NODE_ENV=staging
      - APP_VERSION=${APP_VERSION:-staging}
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3002:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
