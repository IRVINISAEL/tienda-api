name: CI/CD Tienda API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Integración continua (pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package.json }
      - run: npm install
        working-directory: app
      - run: npm test
        working-directory: app

  build:
    name: Construcción y publicación de imagen
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}:${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: APP_VERSION=${{ github.sha }}

  release:
    name: Liberación (entorno staging + pruebas)
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Generar entorno de liberación
        run: ./scripts/setup-release-env.sh
        env: { IMAGE: "${{ needs.build.outputs.image }}", APP_VERSION: "${{ github.sha }}" }
      - name: Pruebas en entorno de liberación
        run: ./tests/smoke/smoke-test.sh http://localhost:3001
      - name: Limpiar entorno
        if: always()
        run: ./scripts/teardown-release-env.sh

  deploy:
    name: Despliegue continuo a producción
    needs: [build, release]
    runs-on: ubuntu-latest
    environment: production        # configurar aprobación manual en Settings > Environments
    steps:
      - uses: actions/checkout@v4
      - name: Copiar archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml,scripts/deploy.sh"
          target: "~/tienda-api"
      - name: Ejecutar despliegue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ~/tienda-api
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE=${{ needs.build.outputs.image }} APP_VERSION=${{ github.sha }} ./scripts/deploy.sh
